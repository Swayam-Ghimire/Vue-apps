<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h1>{{ greeting }} ({{ greeting.length }})</h1>
      <input type="text" v-model="greeting" />
    </div>
    <script>
      Vue.createApp({
        data() {
          return {
            greeting: "hello world from vue instance!!",
          };
        },
        mounted() {
            setTimeout(() => {
                this.greeting = "Changed boi";
            }, 3000);
        },
      }).mount("#app");
    </script>
  </body>
</html>
